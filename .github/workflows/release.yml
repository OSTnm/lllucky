name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test
        shell: pwsh
        run: |
          python -m unittest discover -s backend -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile backend/memory_backend.py backend/worker.py backend/headless.py scripts/package_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify
        shell: pwsh
        run: |
          ./scripts/build_native.ps1 -Verify
      - name: Package release
        shell: pwsh
        run: |
          python scripts/package_release.py --tag "$env:GITHUB_REF_NAME" --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create "$tag" --verify-tag --draft --title "lllucky $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "$tag" "dist/lllucky-$tag-windows-x64.zip" "dist/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$tag" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
